name: Claude Code Review

# Autonomous PR review — fires the moment a PR is opened (or marked ready / reopened),
# no @claude mention required. Runs this repo's own `review-github-pr` skill so the
# review is consistent: the 👁️ review-agent marker, a resolved Approve/Request-changes/
# Needs-discussion verdict, and the AGENTS.md invariants the skill enforces.
#
# Review-only: it comments, it does NOT edit code, approve, or merge — a human still
# owns the formal approval.
#
# Why an LLM reviewer earns its keep here: `ci.yml` already proves the mechanical half
# (typecheck, tests, a real marketplace install in both harnesses). What it cannot prove
# is that a diff still honours AGENTS.md's privacy and cross-harness packaging
# invariants — no credential through the agent, consent asked every time as a complete
# destination set, an atomic version bump, a hook timeout that is the MINIMUM both
# harnesses allow. Those are the checks this workflow exists for.
#
# Activation note: `pull_request` events read this file from the PR head, so this path
# self-tests on the PR that adds it.
#
# Fork note: PRs from forks get a read-only token and no secrets, so this job simply
# won't run for them — which is the safe default.
#
# Drafts are skipped until marked "ready for review" to avoid reviewing work-in-progress.
#
# Manual path: `workflow_dispatch` with a PR number reviews any open PR on demand.
# This is not a convenience — it is the only way to exercise this workflow at all.
# The action refuses to run when the workflow file differs from the copy on the
# DEFAULT branch ("Skipping action due to workflow validation"), and it reports
# that skip as a PASSING check. So every PR that edits this file gets a green
# `claude-review` that reviewed nothing, and the automatic path can never test a
# change to itself. A dispatch runs from the default branch, so the file always
# matches and the action actually runs.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Number of an open PR to review"
        required: true
        type: string

concurrency:
  # `inputs` is null on a pull_request event and `github.event.pull_request` is
  # null on a dispatch, so this resolves to whichever fired.
  group: claude-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # The draft test applies only to the automatic path: on a dispatch there is no
    # `github.event.pull_request`, so `.draft` is null and a bare `== false` would
    # be false — skipping every manual run. Dispatch is explicit and human-invoked,
    # so reviewing a draft on request is the correct behaviour.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read        # read the diff + skill files (no write — review never edits code)
      pull-requests: write  # post the review comment
      issues: read          # read the linked issue for intent
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # Guarantee `gh` in the agent's shell is authenticated (same scoped token
          # as this job's permissions) so the review comment can't silently no-op.
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Surface the SDK's error text. Without this the action prints only
          # "full output hidden for security" and a result block, so an auth or
          # entitlement rejection is indistinguishable from any other failure —
          # `gh run rerun --debug` does NOT lift it, because the gate is this
          # input rather than ACTIONS_STEP_DEBUG. Safe here: this repo is public
          # and the review it prints is posted publicly anyway. Reconsider if the
          # repo ever goes private.
          show_full_output: true

          # This review posts ONE top-level comment via `gh pr comment` — that is
          # the only comment tool in its allowlist, so it never produces inline
          # comments to buffer. Left at the default `true`, the action still runs
          # its post-session "Post buffered inline comments" step, which reports
          # "No buffered inline comments" on every run and needs a PR number to
          # attach to. On the workflow_dispatch path there is no PR event, so that
          # number is empty — a step with nothing to do, aimed at nothing. Turning
          # the buffering off makes the no-op deliberate instead of incidental and
          # removes the only behavioural difference between the two triggers.
          classify_inline_comments: false
          # NO `allowed_bots` — the default (empty) allows no bots, and that is
          # deliberate on a PUBLIC repo. The action's only access gate is that the
          # triggering actor must have write access; per the action's own
          # docs/security.md, allowlisted bots are NOT permission-checked and need
          # neither write access nor an installation here. `allowed_bots: '*'`
          # therefore let any GitHub App — including one created by a stranger —
          # open a PR and invoke this job with a prompt it controls. Adding a bot
          # back means naming it explicitly, never `'*'`.
          prompt: >-
            Review pull request #${{ github.event.pull_request.number || inputs.pr_number }} using the
            review-github-pr skill (.claude/skills/review-github-pr/SKILL.md): read the diff
            and the linked issue, then assess it against AGENTS.md's invariants — privacy and
            consent, cross-harness packaging, atomic version changes — plus correctness,
            security, performance, consistency, and completeness. Post the single structured
            "👁️ review-agent" comment with a resolved verdict (Approve / Request changes /
            Needs discussion).
            AGENTS.md is the source of truth for the invariants; read it, do not rely on
            memory of it.
            HARD RULES: do NOT formally approve the PR, do NOT merge, do NOT push commits or
            edit code — post one review comment only. A human owns the final approval.
          # --allowed-tools must be ONE quoted, comma-separated arg with `:*` wildcards.
          # A space-separated list gets word-split by the action and shreds every Bash(...)
          # pattern that contains a space, silently denying the agent's `gh pr comment`
          # (the review post) while the job still reports success.
          claude_args: >-
            --allowed-tools
            "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh label list:*),Bash(git log:*),Bash(git diff:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(find:*),Bash(jq:*)"
            --model
            claude-opus-5
