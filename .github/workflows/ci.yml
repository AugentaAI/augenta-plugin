name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Nightly, because `install-smoke` installs the `claude` and `codex` CLIs
  # UNPINNED from npm. Their next release can break a plugin this repo did not
  # touch, and a no-change run against `main` is the only thing that catches
  # that before a contributor's PR does.
  schedule:
    - cron: "0 7 * * *"

# Least privilege: CI only needs to read the repo to install, typecheck, and test.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes. The EVENT is part of
# the key because the nightly cron and a push to `main` share `github.ref`: without it
# the 07:00 run cancels the CI of a commit merged at 06:59 — losing the record that
# the commit is green — or that merge cancels the only run watching the unpinned CLIs.
# A PR's own runs still supersede each other: same event, same refs/pull/N/merge.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # First, because it needs no toolchain and costs under a second — and because
      # the thing it guards fails SILENTLY. A shredded agent allowlist never turns a
      # check red; the agent just quietly loses a tool it was granted.
      - name: Claude allowlist shape gate
        run: bash .github/gates/claude-allowlist-shape.sh

      # The fix agent cannot receive `gh api` without also receiving the
      # approve/merge API surface. Prove the trusted post-step resolves exactly the
      # fresh findings reported as fixed, while skipped findings, human threads, and
      # older Claude threads stay open.
      - name: Claude fix conversation-resolution gate
        run: bash .github/gates/claude-fix-resolution.sh

      # The fix agent's push starts a fresh review, which finds more, which the agent
      # fixes, forever. The cap that ends it is decided by this counter, so its two
      # readings — "a round" and "a human push" — are pinned offline.
      - name: Claude fix round-cap gate
        run: bash .github/gates/claude-fix-rounds.sh

      # The other way an agent workflow fails silently. `claude-allowlist-shape.sh`
      # guards a shredded or incomplete allowlist; this guards a pipeline that reports
      # failure when its match SUCCEEDS. Both review asserts had it once, so as a PR
      # accumulated comments they began reporting "the agent posted nothing" about
      # reviews that had posted. One grep, no credentials.
      - name: Workflow pipefail/grep -q gate
        run: bash .github/gates/workflow-pipefail-grep.sh

      # Pinned via .bun-version — one authoritative number, and now genuinely
      # SHARED rather than just declared to be: scripts/build.ts reads the same
      # file and refuses to build on any other Bun. Before that guard existed,
      # this file was the only thing honoring the pin, so a contributor could
      # build on whatever Bun they had, commit five rewritten bundles, and get
      # the check below demanding they be reverted with no cause named.
      #
      # That check is byte-equality, so it is only fair if the build is
      # reproducible. The two inputs that decide it, both measured 2026-09-04:
      #
      #   Bun version — decisive. 1.3.14 emits the __toESMCache_* ESM-interop
      #   prelude; 1.3.5 emits the older `get: () => mod[key]` form and 1.4.1
      #   differs again. This is what the pin is for.
      #
      #   Where node_modules resolved from — Bun labels each bundled module with
      #   its path relative to the build root, so a checkout resolving a
      #   dependency from an ancestor directory bakes `../../../node_modules/…`
      #   into the bytes. `bun install` below settles it here; build.ts guards it
      #   for everyone else.
      #
      # Platform is NOT one of them: at a fixed revision, darwin-arm64 and this
      # runner's linux-x64 emit byte-identical bundles. Nobody needs a container
      # to satisfy this job.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # The bundles in dist/ are what users execute, under whatever Node they
      # have. Pin the FLOOR, not the latest: passing on 24 proves nothing about
      # the 20 a user is on.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --frozen-lockfile makes installs reproducible and fails fast if bun.lock
      # has drifted from package.json.
      - name: Install
        run: bun install --frozen-lockfile

      # Before typecheck and test: the contract test requires every hook command's
      # target to exist, and dist-smoke + the e2e test SPAWN these bundles.
      #
      # `id` so the dist/ check at the end can tell "the build ran and produced
      # something to compare" from "the build refused".
      - name: Build
        id: build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # Secondary check, deliberately after the tests. It proves someone ran
      # `bun run build` and committed the result — it CANNOT tell stale from
      # broken, and the tests above are what prove the bundles work. `git add -N`
      # makes a never-committed bundle visible to `git diff`, so a newly added
      # entrypoint cannot slip through as an untracked file.
      #
      # Still runs when the TESTS fail — a stale dist/ is worth reporting next to
      # a test failure. Skipped when the BUILD refused, because dist/ is then
      # wiped or half-processed and "run 'bun run build' and commit the result"
      # would contradict the cause the build just named.
      - name: Committed bundles match source
        if: always() && steps.build.outcome == 'success'
        run: |
          git add -N dist
          git diff --exit-code -- dist \
            || { echo "::error::dist/ is stale — run 'bun run build' and commit the result."; exit 1; }

  install-smoke:
    name: Claude + Codex marketplace install smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned to the same floor as the `plugin` job, and it matters more here:
      # this job fires the shipped hooks with `node` from a real install, which is
      # the closest thing CI has to a user's machine. On the runner default it
      # would silently test whatever Node ships that month, not the floor README
      # promises.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install plugin CLIs
        run: npm install --global @anthropic-ai/claude-code @openai/codex

      - name: Install and inspect with Claude Code
        run: |
          # Derived, never hardcoded: a hardcoded version silently rotted through
          # a release once already, and a hardcoded hook count would mask a hook
          # the harness failed to discover.
          version="$(jq -r .version package.json)"
          hook_count="$(jq '.hooks | keys | length' hooks/hooks.json)"
          # Same reasoning as the version and the hook count: a hardcoded skill
          # count masks a skill the harness failed to discover, and a hardcoded
          # NAME masks a second skill that never loaded. Both come from the tree.
          skill_count="$(find skills -name SKILL.md | wc -l | tr -d ' ')"
          skill_names="$(find skills -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)"
          claude plugin marketplace add ./
          claude plugin install augenta@augenta
          claude plugin details augenta@augenta | tee claude-plugin-details.txt
          grep -Fq "augenta $version" claude-plugin-details.txt
          grep -Fq "Hooks ($hook_count)" claude-plugin-details.txt

          # The inventory line reads "Skills (2)  connect, recall". Compare the
          # LISTED NAMES as a set against the tree, not as substrings of the whole
          # line: `grep -Fq "call"` matches the `recall` entry, so a substring
          # check passes for a skill the harness never loaded — the exact failure
          # this is here to catch. The count is asserted too, since a set match
          # alone would not notice the harness reporting a wrong total.
          skills_line="$(grep -E '^ *Skills \(' claude-plugin-details.txt)"
          test -n "$skills_line"
          echo "$skills_line" | grep -Fq "Skills ($skill_count)"
          listed="$(
            sed -E 's/^ *Skills \([0-9]+\)[[:space:]]*//' <<<"$skills_line" \
              | tr ',' '\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' | grep -v '^$' | sort
          )"
          if [[ "$listed" != "$skill_names" ]]; then
            echo "Claude loaded a different skill set than the tree declares:"
            echo "  declared: $(tr '\n' ' ' <<<"$skill_names")"
            echo "  loaded:   $(tr '\n' ' ' <<<"$listed")"
            exit 1
          fi

          # Everything above inspects manifests. The rest of this step checks the
          # thing only a real install can: that dist/ is actually COPIED by the
          # marketplace, and that a hook in it runs on a stock Node.
          claude_root="$(ls -d "$HOME/.claude/plugins/cache"/*/augenta/*/ | head -1)"
          test -n "$claude_root"

          # Derived from hooks.json, never hardcoded — same reasoning as the
          # version above: a hardcoded list cannot notice an entrypoint that was
          # added and never built.
          jq -r '.hooks[][].hooks[].command' "$claude_root/hooks/hooks.json" \
            | grep -o 'dist/[A-Za-z0-9_/.-]*' | sort -u > shipped-bundles.txt
          test -s shipped-bundles.txt
          while read -r rel; do
            test -s "$claude_root/$rel" || { echo "missing shipped bundle: $rel"; exit 1; }
          done < shipped-bundles.txt

          # The CLI bundles are invoked by a SKILL.md rather than by hooks.json,
          # so the list above cannot see them. Derive them the same way — per
          # INSTALLED skill, which also proves the marketplace copied the skills.
          for skill in "$claude_root"/skills/*/SKILL.md; do
            grep -oh 'dist/scripts/[A-Za-z0-9_-]*\.mjs' "$skill" | sort -u > skill-bundles.txt
            test -s skill-bundles.txt || { echo "skill invokes no bundle: $skill"; exit 1; }
            while read -r rel; do
              test -s "$claude_root/$rel" || { echo "missing skill bundle: $rel ($skill)"; exit 1; }
            done < skill-bundles.txt
          done

          # The hook commands are not `node <bundle>` — they go through a shell
          # runner that lives OUTSIDE dist/, so the marketplace has to copy it too.
          test -s "$claude_root/scripts/run-node-hook.sh"

          # Fire a hook for real, from the INSTALLED tree, through the command the
          # manifest actually DECLARES. Every check above is `test -s`, which
          # cannot tell a working bundle from a 50KB file that exits 0 and prints
          # nothing — the exact failure that shipped once. Invoking `node` directly
          # would not exercise the runner, which is where that failure now moved.
          project="$(mktemp -d)"
          export CLAUDE_PLUGIN_ROOT="${claude_root%/}"
          session_start_command="$(
            jq -r '.hooks.SessionStart[0].hooks[0].command' "$claude_root/hooks/hooks.json"
          )"
          printf '{"transcript_path":"%s/.claude/projects/p/s.jsonl","cwd":"%s"}' "$HOME" "$project" \
            | sh -c "$session_start_command" | tee hook-out.json
          jq -e '.hookSpecificOutput.initialUserMessage == "/augenta:connect"' hook-out.json

          # Fire the READ door too, from the installed tree, on a project that
          # never opted in. It needs no network: with no config there is nothing
          # to ask and nowhere to ask it, which is exactly the invariant worth
          # proving on the shipped bytes.
          node "$claude_root/dist/scripts/recall.mjs" --json --project "$project" "smoke" \
            | tee recall-out.json
          jq -e '.status == "not_connected"' recall-out.json
          test ! -d "$project/.augenta"

          # And the privacy invariant on the real artifact: a project that never
          # opted in gets no output and no state on disk.
          stop_command="$(jq -r '.hooks.Stop[0].hooks[0].command' "$claude_root/hooks/hooks.json")"
          printf '{"session_id":"s","transcript_path":"/nonexistent.jsonl","cwd":"%s","hook_event_name":"Stop"}' "$project" \
            | sh -c "$stop_command" > capture-out.txt 2> capture-err.txt
          test ! -s capture-out.txt
          test ! -d "$project/.augenta"
          # The runner resolved a runtime rather than falling through to its
          # diagnostic, which a passing exit code alone would not prove.
          ! grep -q "Augenta hook:" capture-err.txt

      - name: Install and inspect with Codex
        run: |
          version="$(jq -r .version package.json)"
          hook_count="$(jq '.hooks | keys | length' hooks/hooks.json)"
          skill_count="$(find skills -name SKILL.md | wc -l | tr -d ' ')"
          skill_names="$(find skills -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)"
          # A JSON array of the skill ids Codex should report, derived from the
          # tree and sorted so the comparison below is order-independent.
          skill_ids="$(printf '%s\n' $skill_names | jq -R . | jq -s 'map("augenta:" + .)')"
          codex plugin marketplace add .
          codex plugin add augenta@augenta --json | tee codex-install.json
          codex plugin list --json | tee codex-plugins.json
          jq -e --arg v "$version" '.installed[] | select(
            .pluginId == "augenta@augenta" and
            .version == $v and
            .enabled == true
          )' codex-plugins.json
          codex_plugin_root="$(jq -r '.installedPath' codex-install.json)"
          for name in $skill_names; do
            test -f "$codex_plugin_root/skills/$name/SKILL.md" \
              || { echo "the Codex install is missing the $name skill"; exit 1; }
          done
          test "$(find "$codex_plugin_root/skills" -name SKILL.md | wc -l | tr -d ' ')" -eq "$skill_count"
          test "$(jq -r '.hooks' "$codex_plugin_root/.codex-plugin/plugin.json")" = './hooks/hooks.json'
          test "$(jq '.hooks | keys | length' "$codex_plugin_root/hooks/hooks.json")" -eq "$hook_count"
          node .github/scripts/read-codex-plugin.mjs "$PWD/.agents/plugins/marketplace.json" augenta \
            | tee codex-plugin-read.json
          jq -e --arg v "$version" --argjson hooks "$hook_count" --argjson ids "$skill_ids" '
            .summary.localVersion == $v and
            ([.skills[].name] | sort) == $ids and
            all(.skills[]; .enabled == true) and
            all(.skills[]; .interface != null and .interface.shortDescription != null) and
            (.hooks | length == $hooks)
          ' codex-plugin-read.json

          # .codexignore prunes the Codex bundle, so whether dist/ survives that
          # pruning is a genuinely separate question from the Claude leg above.
          jq -r '.hooks[][].hooks[].command' "$codex_plugin_root/hooks/hooks.json" \
            | grep -o 'dist/[A-Za-z0-9_/.-]*' | sort -u > codex-bundles.txt
          test -s codex-bundles.txt
          while read -r rel; do
            test -s "$codex_plugin_root/$rel" || { echo "missing shipped bundle: $rel"; exit 1; }
          done < codex-bundles.txt

          # .codexignore prunes the bundle, so the skill-invoked CLIs need the
          # same derived check the Claude leg makes.
          for skill in "$codex_plugin_root"/skills/*/SKILL.md; do
            grep -oh 'dist/scripts/[A-Za-z0-9_-]*\.mjs' "$skill" | sort -u > codex-skill-bundles.txt
            test -s codex-skill-bundles.txt || { echo "skill invokes no bundle: $skill"; exit 1; }
            while read -r rel; do
              test -s "$codex_plugin_root/$rel" || { echo "missing skill bundle: $rel ($skill)"; exit 1; }
            done < codex-skill-bundles.txt
          done

          # The harness split is chosen from the transcript path shape, so this
          # exercises a different branch of the same bundle than the Claude fire.
          codex_project="$(mktemp -d)"
          printf '{"transcript_path":"%s/.codex/sessions/2026/06/24/rollout-2026-06-24T00-00-00-a.jsonl","cwd":"%s"}' \
            "$HOME" "$codex_project" \
            | node "$codex_plugin_root/dist/hooks/session-start.mjs" | tee codex-hook-out.json
          jq -e '
            .hookSpecificOutput.hookEventName == "SessionStart" and
            (.hookSpecificOutput.additionalContext | type == "string") and
            (.hookSpecificOutput.additionalContext | contains("$augenta:connect")) and
            ((.hookSpecificOutput | keys | sort) == ["additionalContext", "hookEventName"])
          ' codex-hook-out.json
