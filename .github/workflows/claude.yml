name: Claude Code

# The on-demand bot: triggered when a teammate writes `@claude …` on an issue, PR, or
# review (works from anywhere, including the GitHub mobile app). Unlike the two
# autonomous workflows, this one CAN edit code and open/update PRs — `contents: write`
# plus Edit/Write and `git commit`/`git push` in its allowlist.
#
# What it cannot do is land unreviewed work. Merging is gated by GitHub itself: the
# required `CI / typecheck + test` status check plus human approval via branch
# protection. So even a prompt-injected PR cannot merge on the bot's say-so.
#
# Activation note: `issues` and `issue_comment` events read this file from the DEFAULT
# branch, so `@claude` only works after this is merged to `main`.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Serialize per issue/PR, but never cancel: an in-flight run may be mid-commit or
# mid-push, and cancelling it would leave the branch in a half-written state.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' &&
        (
          contains(github.event.issue.body, '@claude') ||
          contains(github.event.issue.title, '@claude')
        )
      )

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # NOTE: the `claude` and `codex` CLIs are deliberately NOT installed here. The
      # marketplace-install smoke test (plugin details, skill count, hook count) lives in
      # ci.yml and runs automatically on any PR this bot opens, so paying ~a minute of
      # npm-global install on every @claude mention would buy nothing.
      #
      # The Augenta plugin is not dogfooded in this job either. To capture this agent's
      # sessions into Augenta, add an AUGENTA_KEY repo secret, write it to
      # "$HOME/.augenta/key" (chmod 600), and `touch "$HOME/.augenta/capture-enabled"`.

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read

          # --allowed-tools must be ONE quoted, comma-separated arg with `:*` wildcards.
          # A space-separated list of separately-quoted patterns gets word-split by the
          # action, which shreds every pattern containing a space — `Bash(git diff *)`,
          # `Bash(bun run *)`, `Bash(gh pr *)` — and silently denies those calls while the
          # job still reports success. Note the flag is `--allowed-tools`, not
          # `--allowedTools`.
          #
          # `gh pr` / `gh issue` / `gh label` are enumerated by subcommand rather than
          # wildcarded, to withhold exactly two classes of verb:
          #
          #   - `gh pr merge` — the merge gate must not be reachable by the bot. This repo's
          #     `main` is NOT currently branch-protected, so the allowlist IS the gate; a
          #     `gh pr *` wildcard would let a prompt-injected comment talk the bot into
          #     merging its own unreviewed work. Once branch protection requires the CI
          #     check plus an approval, GitHub enforces this too — but defense in depth is
          #     cheap here, since a human merging is no hardship.
          #   - `gh {pr,issue,label} delete` — permanent, and never something the bot needs.
          claude_args: >-
            --allowed-tools
            "Read,Edit,Write,Grep,Glob,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git fetch:*),Bash(git checkout:*),Bash(git branch:*),Bash(bun install:*),Bash(bun run:*),Bash(bun test:*),Bash(bunx tsc:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr diff:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh pr checkout:*),Bash(gh pr status:*),Bash(gh pr checks:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh issue close:*),Bash(gh issue reopen:*),Bash(gh label list:*),Bash(gh label create:*),Bash(gh label edit:*),Bash(gh run list:*),Bash(gh run view:*),Bash(gh run watch:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(find:*),Bash(jq:*)"
            --model
            claude-opus-5
